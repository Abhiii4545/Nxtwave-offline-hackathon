# Persistent Postgres so scans survive free-tier restarts. Render provisions
# it and injects the connection string into the backend automatically — the
# credentials are never handled manually.
databases:
  - name: vanguard-db
    plan: free

services:
  # ── FastAPI backend ──
  # rootDir is intentionally NOT used — Render was not applying it for this
  # blueprint, so every command uses explicit repo-root-relative paths.
  - type: web
    name: vanguard-backend
    runtime: python
    plan: free
    buildCommand: pip install -r vanguard-ai/backend/requirements.txt
    startCommand: cd vanguard-ai/backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # Auto-wired persistent database connection string (from the database above).
      - key: DATABASE_URL
        fromDatabase:
          name: vanguard-db
          property: connectionString
      # Match local; Render defaults new services to 3.13 where pinned deps fail.
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Allow the deployed frontend to call the API. "*" is fine for a public
      # demo API with no auth; tighten to the frontend URL if you add auth.
      - key: CORS_ORIGINS
        value: "*"
      # Optional — real Groq LLM responses. Leave unset to use mock AI output.
      - key: GROQ_API_KEY
        sync: false

  # ── React / Vite frontend (static) ──
  - type: web
    name: vanguard-frontend
    runtime: static
    buildCommand: cd vanguard-ai/frontend && npm install && npm run build
    staticPublishPath: vanguard-ai/frontend/dist
    envVars:
      # Baked in at build time. fromService `host` returned only the service
      # name (no .onrender.com), breaking DNS — use the full backend URL.
      - key: VITE_API_URL
        value: https://vanguard-backend-4ibe.onrender.com
    routes:
      # SPA fallback so client-side routes (/scan, /dashboard/…) resolve.
      - type: rewrite
        source: /*
        destination: /index.html
