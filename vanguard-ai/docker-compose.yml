version: '3.8'

services:
  juiceshop:
    image: bkimminich/juice-shop
    ports:
      - "3000:3000"
    networks:
      - vanguard

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8080
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
      -config api.key=vanguard-zap-key
    ports:
      - "8080:8080"
    networks:
      - vanguard

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ZAP_API_URL=http://zap:8080
      - ZAP_API_KEY=vanguard-zap-key
      - JUICE_SHOP_URL=http://juiceshop:3000
      - DATABASE_URL=sqlite:///./vanguard.db
    volumes:
      - ./backend:/app
    depends_on:
      - zap
      - juiceshop
    networks:
      - vanguard

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend
    networks:
      - vanguard

networks:
  vanguard:
    driver: bridge
